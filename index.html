<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stars Graph</title>
    <script>
      // Apply the theme before first paint (NFR-8, T3.9): a light/dark
      // override stored by src/lib/theme.ts wins, otherwise follow the
      // system scheme. The app takes over once React mounts.
      (function () {
        var pref = null;
        try {
          pref = window.localStorage.getItem("stars-graph:theme");
        } catch (e) {}
        var dark =
          pref === "dark" ||
          (pref !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
